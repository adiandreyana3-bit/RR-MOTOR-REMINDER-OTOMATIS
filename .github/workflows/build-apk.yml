name: Build RR MOTOR REMINDER APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Siapkan Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Periksa konfigurasi Firebase
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "File app/google-services.json belum tersedia"
            exit 1
          fi

      - name: Bangun APK
        run: gradle assembleDebug --stacktrace --info

      - name: Simpan APK untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: RR-MOTOR-REMINDER-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
